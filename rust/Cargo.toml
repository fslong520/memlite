[package]
name = "memlite"
version = "0.2.0"
edition = "2021"
description = "简化嵌入式记忆系统——JSONL 分块存储、BM25+语义双档检索、GitHub 同步、rules 注入"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
# embed-server 子命令（`memlite embed-server`）：端侧嵌入服务，ort 静态链入
# 钉死 rc.13：与 respire/1memory 同版已验证；rc.14 起 Session::builder 引入 Environment 参数
ort = { version = "=2.0.0-rc.13" }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig", "progressbar"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
