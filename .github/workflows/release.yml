name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: memlite
            asset: memlite-x86_64-unknown-linux-gnu
            rustflags: ''
            cflags: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: memlite.exe
            asset: memlite-x86_64-pc-windows-msvc.exe
            # ort 预编译库 MD 与 cc 默认 /MT 恒错配（LNK2038）：双层修法缺一复发——
            # ①rustc 侧 -crt-static ②cc 不吃 RUSTFLAGS，须 CFLAGS=/MD 强灌
            rustflags: -C target-feature=-crt-static
            cflags: /MD
          - os: macos-14
            target: aarch64-apple-darwin
            bin: memlite
            asset: memlite-aarch64-apple-darwin
            rustflags: ''
            cflags: ''
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      CFLAGS: ${{ matrix.cflags }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add "$TARGET"

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Build release
        working-directory: rust
        run: cargo build --release

      - name: Smoke
        working-directory: rust
        run: |
          "./target/release/${{ matrix.bin }}" --version
          "./target/release/${{ matrix.bin }}" inject --help >/dev/null

      - name: Package
        run: cp "rust/target/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package & upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          mv memlite-x86_64-unknown-linux-gnu "memlite-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mv memlite-x86_64-pc-windows-msvc.exe "memlite-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.exe"
          mv memlite-aarch64-apple-darwin "memlite-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          cp ../docs/memlite-rules.md .
          sha256sum "memlite-${GITHUB_REF_NAME}-"* memlite-rules.md > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          # 刚 create 的 release 资产端点最终一致，首传可能瞬时 404（实测 v0.1.2）——逐文件重试
          sleep 5
          for f in "memlite-${GITHUB_REF_NAME}-"* memlite-rules.md SHA256SUMS; do
            for i in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$f" \
                  --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [ "$i" = 5 ]; then echo "上传失败: $f"; exit 1; fi
              sleep 5
            done
          done
